<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>

    <!-- jQuery & Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Product Details Section */
        .product-details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .product-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product-info {
            flex: 1;
            padding-left: 20px;
        }

        .product-title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .product-description {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 20px;
        }

        .stock-status {
            font-size: 18px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 30px;
        }

        .product-button {
            display: inline-block;
            padding: 12px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .product-button:hover {
            background-color: #0056b3;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .product-details {
                flex-direction: column;
                align-items: center;
            }

            .product-info {
                padding-left: 0;
                text-align: center;
            }

            .product-title {
                font-size: 28px;
            }

            .product-description {
                font-size: 14px;
            }

            .price {
                font-size: 20px;
            }

            .stock-status {
                font-size: 16px;
            }

            .product-button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="product-details">
        <!-- Product Image -->
        <div class="product-image">
            <img id="product-image" src="" alt="Product Image">
        </div>

        <!-- Product Info -->
        <div class="product-info">
            <h2 id="product-title" class="product-title"></h2>
            <p id="product-description" class="product-description"></p>
            <p id="product-price" class="price"></p>
            <p id="product-stock" class="stock-status"></p>
            <a href="#" id="buy-now-btn" class="product-button">Buy Now</a>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        // Retrieve the product ID from localStorage
        const productId = localStorage.getItem('product_id');
        console.log("Product ID from localStorage:", productId);  // Debugging log

        if (productId) {
            // Fetch the product details using the product ID
            $.ajax({
                type: "GET",
                url: "/products/getProductById/" + productId,  // API endpoint
                success: function (product) {
                    if (product) {
                        // Populate the product details on the page
                        $('#product-title').text(product.name);
                        $('#product-description').text(product.description);
                        $('#product-price').html(`<strong>$${product.price}</strong>`);
                        $('#product-stock').text(product.stock > 0 ? `In Stock: ${product.stock}` : "Out of Stock");
                        $('#product-image').attr('src', '/images/' + product.imageUrl);
                        $('#buy-now-btn').attr('href', '/order.html?productId=' + product.id);
                    } else {
                        console.log("Product not found in response.");
                        showError("Product not found.");
                    }
                },
                error: function (error) {
                    console.log("Error fetching product details: ", error);
                    showError("Unable to fetch product details. Please try again later.");
                }
            });
        } else {
            console.log("No product ID in localStorage.");
            showError("No product selected. Redirecting...");
            setTimeout(() => {
                window.location.href = "/index.html"; // Redirect to home if no product ID found
            }, 2000);
        }

        // Function to show error messages on the page
        function showError(message) {
            $(".container").html(`
                <div class="alert alert-danger text-center">
                    <strong>Error:</strong> ${message}
                </div>
            `);
        }
    });
</script>

</body>
</html>
